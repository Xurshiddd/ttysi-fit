services:
  # Backend API (ixtiyoriy — Windows Application Control exe'ni bloklasa ishlatiladi)
  # Ishga tushirish: ./run.sh dev-docker
  api:
    build: .
    container_name: ttysi_fit_api
    ports:
      - "8090:8090"
    env_file: .env.local
    environment:
      # Postgres va Redis — compose tarmog'i ichida (host portlari emas)
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["api"]   # `docker compose up redis` bunga tegmaydi

  postgres:
    image: postgres:16-alpine
    container_name: ttysi_fit_postgres
    restart: unless-stopped
    ports:
      # Host 5433 — 5432 da host'ning native PostgreSQL 18 'i turibdi
      # (Redis 6380 da bo'lgani kabi, to'qnashuvni oldini olish uchun).
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env.local da berilishi shart}
      POSTGRES_DB: ${DB_NAME:-ttysi_fit_dev}
      # Kunlik chegara/CURRENT_DATE mintaqasi — CLAUDE.md APP_TIMEZONE bilan bir xil
      TZ: Asia/Tashkent
      PGTZ: Asia/Tashkent
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ttysi_fit_dev}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ttysi_fit_redis
    restart: unless-stopped
    ports:
      # Host 6380 (boshqa loyihaning 6379 Redis'i bilan to'qnashmaslik uchun)
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  redis_data:
